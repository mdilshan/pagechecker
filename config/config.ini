[server]
; server port
port = 8000

[downloader]
; main URL download timeout 
timeout = 30s
; read stops after this many MB of html
max_body_mb = 5

[linkchecker]
; how long to wait for each link
timeout = 10s
; links checked at the same time per request
workers = 10
; links checked at the same time across the whole server
max_concurrent = 100
