root = "."
tmp_dir = "tmp"

[build]
  pre_cmd = ["templ generate"]
  cmd = "go build -o ./tmp/server ./cmd"
  entrypoint = ["./tmp/server"]

  include_ext = ["go", "templ", "ini", "css"]
  exclude_dir = ["tmp", "bin", "vendor", ".git"]
  exclude_regex = ["_test\\.go$", "_templ\\.go$"]

  delay = 500
  kill_delay = "1s"
  stop_on_error = true
  send_interrupt = true

[misc]
  clean_on_exit = true
